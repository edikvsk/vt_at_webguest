[pytest]
# Основные опции pytest
addopts = 
    -p no:faulthandler
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --capture=no
    --show-capture=all
    --maxfail=5
    -p no:cacheprovider

# Минимальная версия pytest
minversion = 6.0

# Директории для поиска тестов
testpaths = test

# Паттерны для поиска тестовых файлов
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Маркеры для категоризации тестов
markers =
    smoke: Smoke тесты - базовая функциональность
    regress: Регрессионные тесты
    negative: Негативные тесты
    security: Тесты безопасности
    stream_controls: Тесты управления стримом
    wg_settings: Тесты настроек WebGuest
    url_settings: Тесты URL параметров
    web_preview: Тесты веб-превью
    audio_bitrate: Тесты аудио битрейта
    video_bitrate: Тесты видео битрейта
    framerate: Тесты частоты кадров
    resolution: Тесты разрешения
    video_encoder: Тесты видеокодеков
    audio_channels: Тесты аудиоканалов
    slow: Медленные тесты (> 30 секунд)
    fast: Быстрые тесты (< 10 секунд)
    flaky: Нестабильные тесты
    skip_ci: Пропускать в CI
    windows_only: Только для Windows
    requires_camera: Требует камеру
    requires_microphone: Требует микрофон

# Фильтры предупреждений
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore:.*selenium.*:DeprecationWarning
    ignore:.*pywinauto.*:DeprecationWarning

# Настройки логирования
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Отключаем файловое логирование pytest, так как у нас есть кастомное
# log_file = logs/pytest.log
# log_file_level = DEBUG
# log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d: %(message)s
# log_file_date_format = %Y-%m-%d %H:%M:%S

# Автоматическое использование фикстур
usefixtures =
